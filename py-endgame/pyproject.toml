[tool.poetry]
name = "endgame"
# Bumping this and merging to main cuts a `py-endgame-v<version>` tag and a
# release for it -- see .github/workflows/tag_release.yml. Nothing in this
# repo pins a version (py-endgame-aws takes this package by path), so the tag
# is for anything outside it, and for naming a state of the package that isn't
# a commit sha.
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
python = "^3.10"
aiofiles = "^25.1.0"
aiohttp = "^3.8.1"
fire = ">=0.7.0,<1"
python-dateutil = "^2.8.2"
beautifulsoup4 = "^4.10.0"
dataclasses-json = "^0.5.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.16.1"
ty = "^0.0.65"
ipykernel = "^6.29.5"
typing-extensions = ">=4.4.0"
pytest-asyncio = "^0.26.0"

[tool.poetry.scripts]
endgame = "endgame.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    # Calls a third-party API for real. Runs by default, so a local `pytest`
    # is unchanged; CI deselects it with `-m "not network"` -- see the
    # workflow for why.
    "network: talks to a live third-party API",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# these just re-export names for the public API
"__init__.py" = ["F401"]
