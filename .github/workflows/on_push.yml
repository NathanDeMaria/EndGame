name: Run make push

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [py-endgame, py-endgame-aws]

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install poetry
      run: pip install poetry
    - name: Install dependencies
      working-directory: ${{ matrix.package }}
      run: poetry install
    - name: ruff format --check
      working-directory: ${{ matrix.package }}
      run: poetry run ruff format --check .
    - name: ruff check
      working-directory: ${{ matrix.package }}
      run: poetry run ruff check .
    - name: ty check
      working-directory: ${{ matrix.package }}
      run: poetry run ty check .

  # Not matrixed over both packages the way `lint` is, because only one of
  # them has tests a merge gate can run. py-endgame-aws's `stores_test.py`
  # lists a real S3 bucket and `main_test.py` is a hand-run script rather
  # than a test at all -- so there is nothing there to gate on yet, and
  # pretending otherwise would mean wiring AWS credentials into a job that
  # currently needs none.
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install poetry
      run: pip install poetry
    - name: Install dependencies
      working-directory: py-endgame
      run: poetry install
    # `not network` drops the two play-by-play tests, which call ESPN for
    # real and assert exact counts against what it serves back. They are
    # worth having and a local `pytest` still runs them; they are not worth
    # gating a merge on, because then an ESPN outage, a rate limit, or a
    # play-by-play revised upstream fails the build for reasons that have
    # nothing to do with the commit.
    - name: pytest
      working-directory: py-endgame
      run: poetry run pytest -m "not network"

  make-push:
    needs: [lint, test]
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      IMAGE_URL: ${{ secrets.IMAGE_URL }}

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Needed to get the full git history for rev-parse
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Run make push
      # Layer cache lives in ECR alongside the image rather than in the Actions
      # cache. `type=gha` needs ACTIONS_RUNTIME_TOKEN, which the runner only
      # hands to JS actions and deliberately withholds from `run:` steps, so a
      # bare `docker buildx build` in the Makefile can't reach it without
      # re-exporting the runner's internals. Registry cache authenticates with
      # the ECR login the push already does, so CI and local stay one build
      # definition with nothing smuggled between them.
      # image-manifest/oci-mediatypes are required: ECR rejects buildx's
      # default cache manifest format.
      # All branches share one :buildcache tag. Unlike the Actions cache it
      # isn't scoped per branch, but the layers worth reusing (apt, poetry
      # install) are the same everywhere, and a stale write is just a miss.
      run: |
        cd py-endgame-aws
        echo '${{ secrets.BATCH_CORE_CONFIG }}' > config.json
        make push TAG=${GITHUB_SHA::7} \
          CACHE_FLAGS="--cache-from type=registry,ref=${IMAGE_URL}:buildcache \
            --cache-to type=registry,ref=${IMAGE_URL}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
