name: Run make push

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [py-endgame, py-endgame-aws]

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install poetry
      run: pip install poetry
    - name: Install dependencies
      working-directory: ${{ matrix.package }}
      run: poetry install
    - name: ruff format --check
      working-directory: ${{ matrix.package }}
      run: poetry run ruff format --check .
    - name: ruff check
      working-directory: ${{ matrix.package }}
      run: poetry run ruff check .
    - name: ty check
      working-directory: ${{ matrix.package }}
      run: poetry run ty check .

  # Not matrixed over both packages the way `lint` is, because only one of
  # them has tests a merge gate can run. py-endgame-aws's `stores_test.py`
  # lists a real S3 bucket and `main_test.py` is a hand-run script rather
  # than a test at all -- so there is nothing there to gate on yet, and
  # pretending otherwise would mean wiring AWS credentials into a job that
  # currently needs none.
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install poetry
      run: pip install poetry
    - name: Install dependencies
      working-directory: py-endgame
      run: poetry install
    # `not network` drops the two play-by-play tests, which call ESPN for
    # real and assert exact counts against what it serves back. They are
    # worth having and a local `pytest` still runs them; they are not worth
    # gating a merge on, because then an ESPN outage, a rate limit, or a
    # play-by-play revised upstream fails the build for reasons that have
    # nothing to do with the commit.
    - name: pytest
      working-directory: py-endgame
      run: poetry run pytest -m "not network"

  make-push:
    needs: [lint, test]
    runs-on: ubuntu-latest

    # The push assumes `endgame-ci-image` by OIDC, which only trusts main.
    # Every other branch and every PR builds the image -- so a broken
    # Dockerfile still fails here -- but pushes nothing. Nothing wants a
    # branch's image in ECR; `make push TAG=<sha>` from a laptop is the way to
    # get one.
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-2
      # The SSM parameter the shared stack publishes its non-sensitive outputs
      # to. The push reads the bucket name and the ECR URL out of it rather
      # than carrying either as a secret. Matches the default of
      # `shared_outputs_parameter` in jobs/variables.tf, which is also what
      # scopes endgame-ci-image's read to it; if that ever moves, both move.
      SHARED_OUTPUTS_PARAMETER: /batch/shared-outputs
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Needed to get the full git history for rev-parse
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build the image
      if: env.PUSH != 'true'
      working-directory: py-endgame-aws
      run: |
        echo '{}' > config.json
        make build IMAGE_URL=endgame TAG=ci

    # Dormant until the role ARN is set as a repository variable, the same way
    # terraform.yml's plan and apply are: a main push before then reports
    # green with a note rather than failing red.
    - name: Check for the image role
      if: env.PUSH == 'true' && vars.AWS_IMAGE_ROLE_ARN == ''
      run: |
        echo "AWS_IMAGE_ROLE_ARN is not set -- skipping the push." \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Configure AWS credentials
      if: env.PUSH == 'true' && vars.AWS_IMAGE_ROLE_ARN != ''
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ vars.AWS_IMAGE_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    # `config.json` is what `Config.init_from_file` reads for the bucket name
    # (it's baked into the image -- see ../.dockerignore) and what the
    # Makefile reads for the ECR URL. It used to be the BATCH_CORE_CONFIG
    # secret, a pasted `terraform output -json`; it's derived from the shared
    # stack's published outputs instead, so there is nothing to re-paste when
    # that stack changes.
    #
    # Filtered to the keys this repo reads, and re-wrapped as `{"value": ...}`
    # so it keeps the `terraform output -json` shape both readers expect. A
    # missing key fails here, rather than at import time in a Batch job.
    - name: Build config.json from the shared stack's outputs
      if: env.PUSH == 'true' && vars.AWS_IMAGE_ROLE_ARN != ''
      working-directory: py-endgame-aws
      run: |
        aws ssm get-parameter --name "$SHARED_OUTPUTS_PARAMETER" \
            --query Parameter.Value --output text \
          | jq --exit-status '{bucket, repo_urls}
              | if any(.[]; . == null) then error("missing output")
                else map_values({value: .}) end' \
          > config.json
        echo "IMAGE_URL=$(jq -r .repo_urls.value.endgame config.json)" >> "$GITHUB_ENV"

    - name: Run make push
      if: env.PUSH == 'true' && vars.AWS_IMAGE_ROLE_ARN != ''
      working-directory: py-endgame-aws
      # Layer cache lives in ECR alongside the image rather than in the Actions
      # cache. `type=gha` needs ACTIONS_RUNTIME_TOKEN, which the runner only
      # hands to JS actions and deliberately withholds from `run:` steps, so a
      # bare `docker buildx build` in the Makefile can't reach it without
      # re-exporting the runner's internals. Registry cache authenticates with
      # the ECR login the push already does, so CI and local stay one build
      # definition with nothing smuggled between them.
      # image-manifest/oci-mediatypes are required: ECR rejects buildx's
      # default cache manifest format.
      run: |
        make push TAG=${GITHUB_SHA::7} \
          CACHE_FLAGS="--cache-from type=registry,ref=${IMAGE_URL}:buildcache \
            --cache-to type=registry,ref=${IMAGE_URL}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
