[tool.poetry]
name = "endgame-aws"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
# endgame_aws/stores.py uses PEP 695 generic syntax (`class Foo[T]`),
# which needs 3.12+ -- ^3.11 here was wrong, the package has never
# actually been importable on 3.11.
python = "^3.12"
fire = ">=0.4.0,<1.0"
aiobotocore = "^3.9.0"
endgame = {git = "https://github.com/NathanDeMaria/EndGame.git", rev = "7879d5283fcc14a38f37835ad7e2501b79560ad3", subdirectory = "py-endgame"}
dataclasses-json = ">=0.5.7,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.16.1"
ty = "^0.0.65"
types-aiobotocore = {extras = ["essential"], version = "^3.2.1"}
ipykernel = "^7.2.0"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
endgame-aws = "endgame_aws.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# these just re-export names for the public API
"__init__.py" = ["F401"]
