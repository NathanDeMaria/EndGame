[tool.poetry]
name = "endgame-aws"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
# endgame_aws/stores.py uses PEP 695 generic syntax (`class Foo[T]`),
# which needs 3.12+ -- ^3.11 here was wrong, the package has never
# actually been importable on 3.11.
python = "^3.12"
fire = ">=0.4.0,<1.0"
aiobotocore = "^3.9.0"
# The sibling package in this repo, by path rather than by git rev.
#
# This used to be `{git = ..., rev = "<sha>"}`, which meant a "bump py-endgame"
# commit here after every py-endgame change -- and the two packages could sit
# at different commits of the same repo, so a green build here said nothing
# about the py-endgame beside it. A version range would have removed the
# bumps, but poetry can't do one over a git dependency: `factory.py` reads
# only branch/tag/rev off a `git = ` constraint and hardcodes the version to
# `*`, so `version = "^0.2"` next to it is silently dropped. Ranges need a
# package index (PyPI, CodeArtifact), which is a lot of auth to wire into CI
# and the image build for a dependency with exactly one consumer.
#
# So: path. One commit is now one consistent state of both packages, and
# everything that builds this already has py-endgame beside it -- CI checks
# out the whole repo, and the image build's context is the repo root (see the
# Makefile and .devcontainer/Dockerfile).
#
# py-endgame is still tagged `py-endgame-v<version>` on merge to main (see
# .github/workflows/tag_release.yml). Nothing here consumes those, but a
# consumer outside this repo can pin one:
#   endgame = {git = "https://github.com/NathanDeMaria/EndGame.git", tag = "py-endgame-v0.1.0", subdirectory = "py-endgame"}
endgame = {path = "../py-endgame", develop = true}
dataclasses-json = ">=0.5.7,<1.0"
# The processed play-by-play layer: the parquet writer, the dataset reader
# that turns a game_id filter into byte ranges, and its own S3 filesystem.
# No pandas -- the schema in `pbp_transform` is a pyarrow one, because most
# of these columns are nullable ints and pandas casts those to float64.
pyarrow = "^25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.16.1"
ty = "^0.0.65"
types-aiobotocore = {extras = ["essential"], version = "^3.2.1"}
ipykernel = "^7.2.0"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
endgame-aws = "endgame_aws.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# these just re-export names for the public API
"__init__.py" = ["F401"]
